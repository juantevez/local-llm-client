<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Llama 3 Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        textarea {
            width: 100%;
            height: 100px;
        }
        #response {
            white-space: pre-wrap;
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
<h1>Interactúa con Llama 3</h1>

<textarea id="prompt" placeholder="Escribe tu pregunta aquí..."></textarea><br>
<button onclick="askLlama()">Enviar</button>

<div id="response">Aquí aparecerá la respuesta del modelo.</div>

<script>
        async function askLlama() {
            const prompt = document.getElementById("prompt").value;
            const responseDiv = document.getElementById("response");
            responseDiv.innerText = "Esperando respuesta...";

            try {
                const res = await fetch("/api/llama/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!res.ok) throw new Error("Error en servidor");

                const data = await res.text();
                responseDiv.innerText = data;
            } catch (error) {
                responseDiv.innerText = "Hubo un error: " + error.message;
            }
        }
    </script>
</body>
</html>
